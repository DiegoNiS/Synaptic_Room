# ============================================
# Synaptic Room — Agents lint/format (Ruff)
# ============================================
line-length = 100
target-version = "py310"

[lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]  # line length handled by the formatter

[lint.per-file-ignores]
"tests/*" = ["B", "E402"]  # tests import after sys.path/stub setup

[format]
quote-style = "double"
